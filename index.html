<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stock-clearance.ai · Global Stock Lots</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E8470C">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StockClear">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "stock-clearance.ai",
  "url": "https://www.stock-clearance.ai/",
  "description": "Global B2B marketplace connecting international buyers with Chinese surplus, overstock, clearance and stock-lot suppliers in the Yiwu Wuyuai market and China industrial belts.",
  "areaServed": "Worldwide",
  "knowsAbout": ["Overstock","Clearance","Liquidation","Stock lots","Surplus inventory","Wholesale"]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "stock-clearance.ai",
  "url": "https://www.stock-clearance.ai/"
}
</script>
</head>
<body>
  <nav class="nav">
    <div class="logo" onclick="go('home')" style="cursor:pointer">stock<b>-</b>clearance<b>.ai</b></div>
    <div class="links">
      <a href="#" onclick="go('home');return false" id="nav-home">Home</a>
      <a href="#" onclick="go('browse');return false" id="nav-browse">Browse</a>
    </div>
    <div class="right">
      <div class="lang">
        <button id="lang-en" onclick="setLang('en')">EN</button>
        <button id="lang-zh" onclick="setLang('zh')">中文</button>
      </div>
      <button class="btn" id="nav-account" onclick="openAccount()">Account</button>
      <button class="btn" id="nav-inq" onclick="go('inbox')">Messages</button>
      <button class="btn prime" onclick="go('post')" id="nav-post">Post Stock</button>
    </div>
  </nav>

  <div id="mode-banner" class="mode-banner" style="display:none"></div>

  <main id="app"></main>

  <footer class="foot">
    stock-clearance.ai · Global B2B stock-lot &amp; clearance marketplace<br>
    <span class="contact-email">📧 Contact: <a href="mailto:BOB@stock-clearance.ai">BOB@stock-clearance.ai</a></span>
  </footer>

  <nav class="bottomnav">
    <button onclick="go('home')"><span class="bn-ic">H</span><span class="bn-lb">Home</span></button>
    <button onclick="go('browse')"><span class="bn-ic">B</span><span class="bn-lb">Browse</span></button>
    <button class="bn-post" onclick="go('post')"><span class="bn-ic">+</span><span class="bn-lb">Post</span></button>
    <button onclick="go('inbox')"><span class="bn-ic">Q</span><span class="bn-lb" id="nav-inq-lb">Msg</span></button>
    <button onclick="openAccount()"><span class="bn-ic">@</span><span class="bn-lb" id="nav-me">Me</span></button>
  </nav>

  <div id="acct-modal" class="modal" style="display:none" onclick="if(event.target===this)closeAccount()"></div>
  <div id="chat-modal" class="modal" style="display:none" onclick="if(event.target===this)closeChat()"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
